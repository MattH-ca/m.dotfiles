name: Close pull requests

on:
  pull_request_target:
    types: [opened, reopened]

permissions:
  pull-requests: write

jobs:
  close:
    name: Comment and close
    if: github.event.pull_request.user.login != github.repository_owner
    runs-on: ubuntu-latest
    steps:
      - name: Comment and close pull request
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        with:
          script: |
            const message = [
              "Thanks for taking an interest in these dotfiles.",
              "This repo is public so you can read it, learn from it, and fork it freely, but it is my personal machine configuration and does not accept outside contributions.",
              "Pull requests are auto-closed here so the repo can stay personal and predictable, and Issues are turned off for the same reason.",
              "If you want to adapt something, or you have found something that would bite anyone who cloned this, please fork the repo and fix it there.",
              "MIT No Attribution: you owe nothing back."
            ].join("\n");

            const { owner, repo } = context.repo;
            const pull_number = context.payload.pull_request.number;

            await github.rest.pulls.createReview({
              owner,
              repo,
              pull_number,
              event: "COMMENT",
              body: message
            });

            await github.rest.pulls.update({
              owner,
              repo,
              pull_number,
              state: "closed"
            });
