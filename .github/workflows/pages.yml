name: Deploy Field Guide

on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          # Create the Pages site on first run; the repo starts without one.
          enablement: true

      - name: Upload field guide
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs

      - name: Deploy field guide
        id: deployment
        uses: actions/deploy-pages@v4
